# LernReaktor – nginx als HTTPS-Vorschaltserver vor Gunicorn
# __SERVER_NAME__ = Domain oder IP-Adresse; Zertifikat: selbstsigniert (ohne Domain) oder Let's Encrypt

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    # Let's-Encrypt-Prüfung (certbot), alles andere auf HTTPS umleiten
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __SERVER_NAME__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 60m;          # Fotos/PDF-Scans der Lernenden
    server_tokens off;

    # Statische Dateien direkt durch nginx (CSS, JS, Schriften)
    location /static/ {
        alias __APP_DIR__/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 200s;       # KI-Anfragen
        proxy_send_timeout 200s;
    }
}
