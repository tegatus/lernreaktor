{% extends "base.html" %}{% from "_macros.html" import csrf %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<div class="card login">
  <div class="login-marke"><span class="markenzeichen">L</span>LernReaktor<small>Übungsplattform Laborant/in EFZ Biologie</small></div>
  <h1>Anmelden</h1>
  <form method="post">{{ csrf() }}
    <label class="feld">Benutzername <input name="benutzername" autocomplete="username" autofocus required></label>
    <label class="feld">Passwort <input name="passwort" type="password" autocomplete="current-password" required></label>
    <button class="btn">Anmelden</button>
  </form>
</div>
{% endblock %}
